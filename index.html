<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AgriGuard AI - Crop Disease Detection</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f4f7f4;
    color: #1a1a1a;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .container {
    background: #ffffff;
    max-width: 520px;
    width: 100%;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 32px;
  }
  h1 {
    font-size: 22px;
    color: #2e7d32;
    margin-bottom: 4px;
  }
  p.subtitle {
    color: #666;
    font-size: 14px;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
    margin-top: 16px;
  }
  select, input[type="file"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
  }
  #preview {
    margin-top: 16px;
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 8px;
    display: none;
  }
  button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: #2e7d32;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #256428; }
  button:disabled { background: #999; cursor: not-allowed; }

  #result {
    margin-top: 24px;
    display: none;
  }

  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px;
    border-radius: 10px 10px 0 0;
    background: #2e7d32;
    color: white;
  }
  .result-header.severity-high { background: #c62828; }
  .result-header.severity-medium { background: #e65100; }
  .result-header.severity-none { background: #2e7d32; }

  .disease-name {
    font-size: 17px;
    font-weight: 700;
  }
  .confidence-badge {
    font-size: 12px;
    background: rgba(255,255,255,0.25);
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .result-body {
    border: 1px solid #e5e5e5;
    border-top: none;
    border-radius: 0 0 10px 10px;
    padding: 4px 16px 16px;
  }

  .info-block {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid #eee;
  }
  .info-block:first-child { border-top: none; margin-top: 12px; padding-top: 0; }
  .info-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #888;
    margin-bottom: 4px;
  }
  .info-text {
    font-size: 14px;
    line-height: 1.5;
    color: #333;
  }
  .severity-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    margin-top: 4px;
  }
  .severity-tag.High { background: #fdecea; color: #c62828; }
  .severity-tag.Medium { background: #fff3e0; color: #e65100; }
  .severity-tag.None { background: #e8f5e9; color: #2e7d32; }

  .prevention-list {
    list-style: none;
    margin-top: 6px;
  }
  .prevention-list li {
    font-size: 14px;
    line-height: 1.5;
    padding-left: 20px;
    position: relative;
    margin-bottom: 6px;
    color: #333;
  }
  .prevention-list li::before {
    content: "✓";
    position: absolute;
    left: 0;
    color: #2e7d32;
    font-weight: 700;
  }

  #error {
    color: #c62828;
    margin-top: 12px;
    font-size: 14px;
    display: none;
    background: #fdf1f1;
    padding: 12px;
    border-radius: 8px;
    line-height: 1.5;
  }
  #loading {
    margin-top: 16px;
    font-size: 14px;
    color: #666;
    display: none;
  }
</style>
</head>
<body>

<div class="container">
  <h1>AgriGuard AI</h1>
  <p class="subtitle">Upload a leaf photo to detect disease and get treatment advice</p>

  <label for="cropType">Select Crop</label>
  <select id="cropType">
    <option value="Tomato">Tomato</option>
    <option value="Potato">Potato</option>
  </select>

  <label for="imageInput">Upload Leaf Photo</label>
  <input type="file" id="imageInput" accept="image/*">

  <img id="preview" alt="Preview">

  <button id="submitBtn">Analyze Leaf</button>

  <div id="loading">Analyzing image, please wait...</div>
  <div id="error"></div>

  <div id="result">
    <div class="result-header" id="resultHeader">
      <div class="disease-name" id="diseaseName"></div>
      <div class="confidence-badge" id="confidenceText"></div>
    </div>
    <div class="result-body">
      <div class="info-block" id="severityBlock">
        <div class="info-label">Severity</div>
        <span class="severity-tag" id="severityTag"></span>
      </div>
      <div class="info-block">
        <div class="info-label">Overview</div>
        <div class="info-text" id="overviewText"></div>
      </div>
      <div class="info-block">
        <div class="info-label">Impact on Crop</div>
        <div class="info-text" id="impactText"></div>
      </div>
      <div class="info-block">
        <div class="info-label">Favorable Weather Conditions</div>
        <div class="info-text" id="weatherText"></div>
      </div>
      <div class="info-block">
        <div class="info-label">Chemical Treatment</div>
        <div class="info-text" id="treatmentText"></div>
      </div>
      <div class="info-block">
        <div class="info-label">Prevention Steps</div>
        <ul class="prevention-list" id="preventionList"></ul>
      </div>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://agriguardai-0i4q.onrender.com/predict";

  const imageInput = document.getElementById("imageInput");
  const preview = document.getElementById("preview");
  const submitBtn = document.getElementById("submitBtn");
  const loading = document.getElementById("loading");
  const errorBox = document.getElementById("error");
  const resultBox = document.getElementById("result");
  const resultHeader = document.getElementById("resultHeader");
  const diseaseName = document.getElementById("diseaseName");
  const confidenceText = document.getElementById("confidenceText");
  const severityTag = document.getElementById("severityTag");
  const overviewText = document.getElementById("overviewText");
  const impactText = document.getElementById("impactText");
  const weatherText = document.getElementById("weatherText");
  const treatmentText = document.getElementById("treatmentText");
  const preventionList = document.getElementById("preventionList");

  imageInput.addEventListener("change", () => {
    const file = imageInput.files[0];
    if (file) {
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
    }
  });

  submitBtn.addEventListener("click", async () => {
    const file = imageInput.files[0];
    const cropType = document.getElementById("cropType").value;

    errorBox.style.display = "none";
    resultBox.style.display = "none";

    if (!file) {
      errorBox.textContent = "Please select an image first.";
      errorBox.style.display = "block";
      return;
    }

    const formData = new FormData();
    formData.append("file", file);
    formData.append("crop_type", cropType);

    submitBtn.disabled = true;
    loading.style.display = "block";

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        body: formData
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Something went wrong");
      }

      if (data.error === "crop_mismatch" || data.error === "not_a_leaf") {
        errorBox.textContent = data.message;
        errorBox.style.display = "block";
        return;
      }

      const severity = data.severity || "None";
      const severityClass = severity === "High" ? "severity-high"
                           : severity === "Medium" ? "severity-medium"
                           : "severity-none";

      resultHeader.className = "result-header " + severityClass;
      diseaseName.textContent = data.disease.replace(/___/g, " - ").replace(/_/g, " ");
      confidenceText.textContent = data.confidence + "% confidence";

      severityTag.textContent = severity;
      severityTag.className = "severity-tag " + severity;

      overviewText.textContent = data.overview || "—";
      impactText.textContent = data.impact || "—";
      weatherText.textContent = data.favorable_conditions || "—";
      treatmentText.textContent = data.chemical_treatment || "—";

      preventionList.innerHTML = "";
      (data.prevention || []).forEach(step => {
        const li = document.createElement("li");
        li.textContent = step;
        preventionList.appendChild(li);
      });

      resultBox.style.display = "block";
    } catch (err) {
      errorBox.textContent = "Error: " + err.message;
      errorBox.style.display = "block";
    } finally {
      submitBtn.disabled = false;
      loading.style.display = "none";
    }
  });
</script>

</body>
</html>
