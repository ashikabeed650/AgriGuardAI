<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriGuard AI - Crop Disease Detection</title>
<style>
  :root {
    --forest: #1b4332;
    --leaf: #2d6a4f;
    --leaf-light: #52796f;
    --cream: #faf6ee;
    --soil: #6b4f3a;
    --amber: #b45309;
    --red: #9b2226;
    --text: #26241f;
    --muted: #6b6558;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--cream);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes checkPop {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .container {
    background: #ffffff;
    max-width: 540px;
    width: 100%;
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(27,67,50,0.08);
    padding: 28px;
    animation: fadeSlideUp 0.5s ease both;
  }
  h1 {
    font-size: 24px;
    color: var(--forest);
    margin-bottom: 4px;
    font-weight: 700;
  }
  p.subtitle {
    color: var(--muted);
    font-size: 14.5px;
    margin-bottom: 22px;
    line-height: 1.4;
  }
  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
    margin-top: 18px;
    color: var(--text);
  }
  select, input[type="file"] {
    width: 100%;
    padding: 11px;
    border: 1.5px solid #ddd6c7;
    border-radius: 8px;
    font-size: 15px;
    background: #fff;
    transition: border-color 0.15s ease;
  }
  select:focus, input[type="file"]:focus { border-color: var(--leaf); outline: none; }

  #preview {
    margin-top: 16px;
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 10px;
    display: none;
    animation: fadeIn 0.4s ease both;
  }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    background: var(--leaf);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover:not(:disabled) { background: var(--forest); transform: translateY(-1px); }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { background: #b5b5ad; cursor: not-allowed; }

  #result { margin-top: 26px; display: none; }

  .result-card {
    border-radius: 12px;
    border: 1.5px solid #e8e2d3;
    overflow: hidden;
    animation: fadeSlideUp 0.5s ease both;
  }

  .result-strip { display: flex; align-items: flex-start; gap: 4px; }
  .strip-bar { width: 6px; flex-shrink: 0; }
  .strip-bar.High { background: var(--red); }
  .strip-bar.Medium { background: var(--amber); }
  .strip-bar.None { background: var(--leaf); }

  .result-content { flex: 1; padding: 20px 20px 8px; }

  .disease-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 4px;
  }
  .disease-name { font-size: 20px; font-weight: 700; color: var(--text); }
  .confidence-badge { font-size: 13px; color: var(--muted); font-weight: 600; }
  .severity-line {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 18px;
  }
  .severity-line.High { color: var(--red); }
  .severity-line.Medium { color: var(--amber); }
  .severity-line.None { color: var(--leaf); }

  .section {
    display: flex;
    gap: 12px;
    padding: 14px 0;
    border-top: 1px solid #f0ece0;
    opacity: 0;
    animation: fadeSlideUp 0.45s ease forwards;
  }
  .section:nth-child(1) { animation-delay: 0.05s; }
  .section:nth-child(2) { animation-delay: 0.12s; }
  .section:nth-child(3) { animation-delay: 0.19s; }
  .section:nth-child(4) { animation-delay: 0.26s; }
  .section:nth-child(5) { animation-delay: 0.33s; }

  .section-icon { flex-shrink: 0; width: 22px; height: 22px; color: var(--leaf-light); margin-top: 1px; }
  .section-body { flex: 1; }
  .section-title { font-size: 14.5px; font-weight: 700; color: var(--soil); margin-bottom: 3px; }
  .section-text { font-size: 14.5px; line-height: 1.55; color: #3a372f; }

  .prevention-list { list-style: none; margin-top: 2px; }
  .prevention-list li {
    font-size: 14.5px;
    line-height: 1.55;
    padding-left: 22px;
    position: relative;
    margin-bottom: 7px;
    color: #3a372f;
    opacity: 0;
    animation: fadeSlideUp 0.35s ease forwards;
  }
  .prevention-list li:nth-child(1) { animation-delay: 0.4s; }
  .prevention-list li:nth-child(2) { animation-delay: 0.46s; }
  .prevention-list li:nth-child(3) { animation-delay: 0.52s; }
  .prevention-list li:nth-child(4) { animation-delay: 0.58s; }
  .prevention-list li:nth-child(5) { animation-delay: 0.64s; }
  .prevention-list li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 7px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--leaf);
    animation: checkPop 0.3s ease both;
    animation-delay: inherit;
  }

  #error {
    color: var(--red);
    margin-top: 12px;
    font-size: 14.5px;
    display: none;
    background: #fdf1ef;
    padding: 14px;
    border-radius: 8px;
    line-height: 1.5;
    border: 1px solid #f3d9d4;
    animation: shake 0.4s ease;
  }

  #loading {
    margin-top: 16px;
    display: none;
    align-items: center;
    gap: 10px;
    font-size: 14.5px;
    color: var(--muted);
  }
  .spinner {
    width: 18px;
    height: 18px;
    border: 2.5px solid #ddd6c7;
    border-top-color: var(--leaf);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>AgriGuard AI</h1>
  <p class="subtitle">Upload a leaf photo to detect disease and get treatment advice</p>

  <label for="cropType">Select Crop</label>
  <select id="cropType">
    <option value="Tomato">Tomato</option>
    <option value="Potato">Potato</option>
  </select>

  <label for="imageInput">Upload Leaf Photo</label>
  <input type="file" id="imageInput" accept="image/*">

  <img id="preview" alt="Preview">

  <button id="submitBtn">Analyze Leaf</button>

  <div id="loading"><div class="spinner"></div><span>Analyzing image, please wait...</span></div>
  <div id="error"></div>

  <div id="result">
    <div class="result-card">
      <div class="result-strip">
        <div class="strip-bar" id="stripBar"></div>
        <div class="result-content">
          <div class="disease-header">
            <div class="disease-name" id="diseaseName"></div>
            <div class="confidence-badge" id="confidenceText"></div>
          </div>
          <div class="severity-line" id="severityLine">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
            <span id="severityWord"></span> risk
          </div>

          <div class="section">
            <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
            <div class="section-body">
              <div class="section-title">What this is</div>
              <div class="section-text" id="overviewText"></div>
            </div>
          </div>

          <div class="section">
            <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>
            <div class="section-body">
              <div class="section-title">Effect on your crop</div>
              <div class="section-text" id="impactText"></div>
            </div>
          </div>

          <div class="section">
            <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M17.5 19a4.5 4.5 0 1 0-1.44-8.76 6 6 0 0 0-11.4 2.26A4 4 0 0 0 5.5 20h12z"/></svg>
            <div class="section-body">
              <div class="section-title">Weather that makes it worse</div>
              <div class="section-text" id="weatherText"></div>
            </div>
          </div>

          <div class="section">
            <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 3h6v4H9zM12 7v14M8 12h8"/></svg>
            <div class="section-body">
              <div class="section-title">What to spray</div>
              <div class="section-text" id="treatmentText"></div>
            </div>
          </div>

          <div class="section">
            <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4z"/></svg>
            <div class="section-body">
              <div class="section-title">How to prevent it next time</div>
              <ul class="prevention-list" id="preventionList"></ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://agriguardai-0i4q.onrender.com/predict";

  const imageInput = document.getElementById("imageInput");
  const preview = document.getElementById("preview");
  const submitBtn = document.getElementById("submitBtn");
  const loading = document.getElementById("loading");
  const errorBox = document.getElementById("error");
  const resultBox = document.getElementById("result");
  const stripBar = document.getElementById("stripBar");
  const diseaseName = document.getElementById("diseaseName");
  const confidenceText = document.getElementById("confidenceText");
  const severityLine = document.getElementById("severityLine");
  const severityWord = document.getElementById("severityWord");
  const overviewText = document.getElementById("overviewText");
  const impactText = document.getElementById("impactText");
  const weatherText = document.getElementById("weatherText");
  const treatmentText = document.getElementById("treatmentText");
  const preventionList = document.getElementById("preventionList");

  imageInput.addEventListener("change", () => {
    const file = imageInput.files[0];
    if (file) {
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
    }
  });

  submitBtn.addEventListener("click", async () => {
    const file = imageInput.files[0];
    const cropType = document.getElementById("cropType").value;

    errorBox.style.display = "none";
    resultBox.style.display = "none";

    if (!file) {
      errorBox.textContent = "Please select an image first.";
      errorBox.style.display = "block";
      return;
    }

    const formData = new FormData();
    formData.append("file", file);
    formData.append("crop_type", cropType);

    submitBtn.disabled = true;
    loading.style.display = "flex";

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        body: formData
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Something went wrong");
      }

      if (data.error === "crop_mismatch" || data.error === "not_a_leaf") {
        errorBox.textContent = data.message;
        errorBox.style.display = "block";
        return;
      }

      const severity = data.severity || "None";

      stripBar.className = "strip-bar " + severity;
      severityLine.className = "severity-line " + severity;
      severityWord.textContent = severity === "None" ? "No" : severity;

      diseaseName.textContent = data.disease.replace(/___/g, " - ").replace(/_/g, " ");
      confidenceText.textContent = data.confidence + "% confidence";

      overviewText.textContent = data.overview || "-";
      impactText.textContent = data.impact || "-";
      weatherText.textContent = data.favorable_conditions || "-";
      treatmentText.textContent = data.chemical_treatment || "-";

      preventionList.innerHTML = "";
      (data.prevention || []).forEach(step => {
        const li = document.createElement("li");
        li.textContent = step;
        preventionList.appendChild(li);
      });

      resultBox.style.display = "none";
      resultBox.offsetHeight; // reflow to restart animation
      resultBox.style.display = "block";
    } catch (err) {
      errorBox.textContent = "Error: " + err.message;
      errorBox.style.display = "block";
    } finally {
      submitBtn.disabled = false;
      loading.style.display = "none";
    }
  });
</script>

</body>
</html>
